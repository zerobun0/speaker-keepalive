# SpeakerKeepAlive settings. Restart the program after editing (or log out and in).

# Keep-alive tone frequency. 20 Hz is below what desktop speakers can audibly reproduce.
FrequencyHz = 20

# Level of the tone as it arrives at the speakers, after Windows volume is applied.
# Raise towards -26 if your speakers still fall asleep; lower towards -40 if you can hear or feel it.
TargetDbfs = -32

# Hard cap on the generated sample (0..1) for very low volumes, so a sudden volume jump can't thump.
MaxAmplitude = 0.9

# Keep running this many seconds after the last real sound from any app, then let the speakers sleep.
HangSeconds = 300

# Stop when the PC is locked.
PauseWhenLocked = 1

# 1 = run all the time (except when locked), ignoring whether anything is playing.
AlwaysOn = 0

# "auto" follows the Windows default output (and sees through FxSound to its real output).
# Or put part of a device name, e.g.  Device = Realtek
Device = auto

# Tone + every other app's peak is kept under this (1 = full scale). With hardware volume (Realtek)
# the mix is sent at full scale and turned down afterwards, so without this the tone + music clips = crackles.
Ceiling = 0.95

# After other audio gets quieter, how slowly (seconds) the tone is allowed to come back up.
DuckReleaseSeconds = 15

# 1 = remember the output you pick and switch back to it when Windows or FxSound change it by
# themselves (a headset/monitor appearing, the screens waking up, sleep, restart).
RememberOutput = 1

# 1 = remember each output's volume and put it back when it jumps by itself (e.g. FxSound carrying
# one device's volume over to another when the output switches).
RememberVolume = 1

# Outputs whose name contains this text start capped at VolumeCapPercent, unless you set them higher
# yourself (then your level is remembered). Empty = no cap.  Example:  VolumeCapDevice = Realtek
VolumeCapDevice =
VolumeCapPercent = 10
