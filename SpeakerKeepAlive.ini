# SpeakerKeepAlive settings. Restart the program after editing (or log out and in).

# Keep-alive tone frequency. 20 Hz is below what desktop speakers can audibly reproduce.
FrequencyHz = 20

# Level of the tone as it arrives at the speakers, after Windows volume is applied.
# Raise towards -26 if your speakers still fall asleep; lower towards -40 if you can hear or feel it.
TargetDbfs = -32

# Hard cap on the generated sample (0..1) for very low volumes, so a sudden volume jump can't thump.
MaxAmplitude = 0.9

# Keep running this many seconds after the last real sound from any app, then let the speakers sleep.
HangSeconds = 300

# Stop when the PC is locked.
PauseWhenLocked = 1

# 1 = run all the time (except when locked), ignoring whether anything is playing.
AlwaysOn = 0

# "auto" follows the Windows default output (and sees through FxSound to its real output).
# Or put part of a device name, e.g.  Device = Realtek
Device = auto
